name: Build Minecraft Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Give Gradle permission
        run: chmod +x ./gradlew

      - name: Build the mod
        run: ./gradlew build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v3
        with:
          name: Compiled Mod Jar
          path: build/libs/*.jar
